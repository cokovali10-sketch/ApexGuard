name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [core, pulsefuzz]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build and vet
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...
          go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  py-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest aiohttp

      - name: Compile check
        run: python -m compileall -q shadownet hexeye

      - name: Run pytest
        run: python -m pytest shadownet/tests hexeye/tests -q

  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint proto
        run: buf lint

      - name: Check generated code is up to date
        run: |
          buf generate
          git diff --exit-code || (echo "Generated code is out of date. Run 'buf generate' and commit." && exit 1)

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all services
        run: docker compose -f deploy/docker-compose.yml build

  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML files
        run: |
          python -c "
          import glob, yaml, sys
          files = [f for f in glob.glob('deploy/**/*.yml', recursive=True) + glob.glob('deploy/**/*.yaml', recursive=True)
                   if '/templates/' not in f.replace('\\\\', '/')]
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print('yaml ok:', f)
          "
