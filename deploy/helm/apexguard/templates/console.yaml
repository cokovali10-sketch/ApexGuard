# ApexConsole deployment + KernelShield DaemonSet + Ollama PVC + Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apexguard.fullname" . }}-console
  labels:
    {{- include "apexguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/part-of: apexguard
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: apexguard
        app.kubernetes.io/component: console
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console
          image: "{{ .Values.images.console }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          resources: {{ toYaml .Values.console.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "apexguard.fullname" . }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apexguard.fullname" . }}-console
  labels:
    {{- include "apexguard.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/part-of: apexguard
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: 80
      targetPort: http
---
# KernelShield agent (DaemonSet, требует Linux с BTF).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "apexguard.fullname" . }}-agent
  labels:
    {{- include "apexguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: apexguard
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: apexguard
        app.kubernetes.io/component: agent
    spec:
      hostPID: {{ .Values.kernelshield.hostPID }}
      tolerations:
        - operator: Exists
      {{- if .Values.kernelshield.privileged }}
      containers:
        - name: agent
          image: "{{ .Values.images.agent }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: AEGIS_GRPC_ENDPOINT
              value: "http://{{ include "apexguard.fullname" . }}-core:{{ .Values.core.grpcPort }}"
            - name: METRICS_LISTEN
              value: 0.0.0.0:9090
          volumeMounts:
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: proc
              mountPath: /proc
              readOnly: true
      volumes:
        - name: btf
          hostPath: { path: /sys/kernel/btf }
        - name: proc
          hostPath: { path: /proc }
      {{- end }}
---
# PVC для Ollama-моделей.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "apexguard.fullname" . }}-ollama
  labels:
    {{- include "apexguard.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.ollama.storageClass }}
  storageClassName: {{ .Values.persistence.ollama.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.ollama.size }}
---
# Ingress
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "apexguard.fullname" . }}
  labels:
    {{- include "apexguard.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "apexguard.fullname" . }}-console
                port: { name: http }
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "apexguard.fullname" . }}-core
                port: { name: http }
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ include "apexguard.fullname" . }}-core
                port: { name: http }
{{- end }}
